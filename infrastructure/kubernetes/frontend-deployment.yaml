apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidroom-frontend
  labels:
    app: bidroom-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bidroom-frontend
  template:
    metadata:
      labels:
        app: bidroom-frontend
    spec:
      containers:
      - name: frontend
        image: <YOUR_ACR_NAME>.azurecr.io/bidroom-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bidroom-frontend-service
spec:
  selector:
    app: bidroom-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP

