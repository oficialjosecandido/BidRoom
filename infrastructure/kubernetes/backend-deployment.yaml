apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidroom-backend
  labels:
    app: bidroom-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bidroom-backend
  template:
    metadata:
      labels:
        app: bidroom-backend
    spec:
      containers:
      - name: backend
        image: <YOUR_ACR_NAME>.azurecr.io/bidroom-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: bidroom-secrets
              key: mongodb-uri
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: bidroom-secrets
              key: redis-host
        - name: REDIS_PORT
          value: "6380"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bidroom-secrets
              key: redis-password
        - name: REDIS_TLS_ENABLED
          value: "true"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: bidroom-secrets
              key: jwt-secret
        - name: AZURE_AD_B2C_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: bidroom-secrets
              key: azure-ad-b2c-client-id
        - name: AZURE_AD_B2C_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: bidroom-secrets
              key: azure-ad-b2c-client-secret
        - name: AZURE_AD_B2C_TENANT_NAME
          valueFrom:
            secretKeyRef:
              name: bidroom-secrets
              key: azure-ad-b2c-tenant-name
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: bidroom-secrets
              key: azure-storage-connection-string
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bidroom-secrets
              key: stripe-secret-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bidroom-backend-service
spec:
  selector:
    app: bidroom-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP

