# Example secrets file - DO NOT commit actual secrets to git
# Use this as a template and create your own secrets.yaml
# Apply with: kubectl apply -f secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: bidroom-secrets
type: Opaque
stringData:
  # MongoDB
  mongodb-uri: "mongodb+srv://username:password@cluster.mongodb.net/bidroom?retryWrites=true&w=majority"
  
  # Redis (Azure Cache for Redis)
  redis-host: "your-redis-cache.redis.cache.windows.net"
  redis-password: "your-redis-password"
  
  # JWT
  jwt-secret: "your-super-secret-jwt-key-change-in-production"
  
  # Azure AD B2C
  azure-ad-b2c-client-id: "your-azure-ad-b2c-client-id"
  azure-ad-b2c-client-secret: "your-azure-ad-b2c-client-secret"
  azure-ad-b2c-tenant-name: "your-tenant-name"
  
  # Azure Storage
  azure-storage-connection-string: "DefaultEndpointsProtocol=https;AccountName=...;AccountKey=...;EndpointSuffix=core.windows.net"
  
  # Stripe
  stripe-secret-key: "sk_live_your-stripe-secret-key"
  stripe-webhook-secret: "whsec_your-webhook-secret"

