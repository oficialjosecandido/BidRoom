apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bidroom-ingress
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - www.bidroom.co
    - api.bidroom.co
    secretName: bidroom-tls-secret
  rules:
  - host: www.bidroom.co
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bidroom-frontend-service
            port:
              number: 80
  - host: api.bidroom.co
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bidroom-backend-service
            port:
              number: 80

