<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <title>BidRoom</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Listing images and the API live on other origins; opening those
       connections early removes a DNS+TLS round-trip from the LCP path.
       Account name is historically "bidroomimagesdev" and is also used in prod. -->
  <link rel="preconnect" href="https://bidroomimagesdev.blob.core.windows.net" crossorigin>
  <link rel="dns-prefetch" href="https://bidroomimagesdev.blob.core.windows.net">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#C9A84C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BidRoom">
  <meta name="description" content="BidRoom — Leilões premium. Compra e vende artigos únicos através de leilões em tempo real, Melhor Proposta ou Sala Privada exclusiva.">
  <meta name="keywords" content="leilões online, comprar online, vender online, BidRoom, leilões premium, sala privada">
  <meta name="author" content="BidRoom">
  <meta name="robots" content="index, follow">

  <!-- Open Graph (default — overridden per-page by SeoService) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BidRoom">
  <meta property="og:locale" content="pt_PT">
  <meta property="og:title" content="BidRoom — Leilões Premium">
  <meta property="og:description" content="Compra e vende artigos únicos através de leilões em tempo real, Melhor Proposta ou Sala Privada. Pagamentos seguros, payouts directos.">
  <meta property="og:url" content="https://www.bidroom.pt/">
  <meta property="og:image" content="https://www.bidroom.pt/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@bidroompt">
  <meta name="twitter:title" content="BidRoom — Leilões Premium">
  <meta name="twitter:description" content="Compra e vende artigos únicos através de leilões em tempo real, Melhor Proposta ou Sala Privada.">
  <meta name="twitter:image" content="https://www.bidroom.pt/og-image.png">

  <!-- Canonical -->
  <link rel="canonical" href="https://www.bidroom.pt/">
  <!--
    APP_CONFIG overrides Angular’s environment.defaultApiBaseUrl when set (non-empty).
    Azure Static Web Apps: use build-time substitution or SWA app settings + a small script.
      API_URL                 → e.g. https://bidroom-backend.azurewebsites.net/api
      STRIPE_PUBLISHABLE_KEY  → pk_live_... (production) or pk_test_... (staging)

    Leave API_URL empty to use the default from environment.prod.ts / environment.ts.
  -->
  <script>
    window.APP_CONFIG = {
      /**
       * Local ng serve: '/api' (proxy.conf.json).
       * Azure SWA / production: use full backend URL (CI patches this on deploy).
       * Empty or relative on non-localhost hosts is ignored — see api.config.ts.
       */
      API_URL: '/api',
      // API_URL: 'https://bidroom-backend-dev.azurewebsites.net/api',
      STRIPE_PUBLISHABLE_KEY: 'pk_test_51TI5X806hw2O8NlNioZFt34bFn38uQPhm4hayUKZtrPf41BWH4xxdjiox9gNlMpSSHdUfCYtAM5FNX1UF3KyhNuP00Vqz8RtvH'
    };
  </script>
  <!-- Early theme (matches ThemeService): reduces flash before Angular boot -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('bidroom-theme-preference') || 'system';
        var r = p === 'light' ? 'light' : p === 'dark' ? 'dark' : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', r);
        document.documentElement.style.setProperty('color-scheme', r);
      } catch (e) {}
    })();
  </script>

  <!-- Google tag (gtag.js) — loaded once, and only after the page is interactive
       so it never competes with the LCP image for bandwidth on mobile. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4FDFR1ZSRV');
    window.addEventListener('load', function () {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-4FDFR1ZSRV';
      document.head.appendChild(s);
    }, { once: true });
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
