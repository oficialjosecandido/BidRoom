  <!--
    APP_CONFIG overrides Angular’s environment.defaultApiBaseUrl when set (non-empty).
    Azure Static Web Apps: use build-time substitution or SWA app settings + a small script.
      API_URL                 → e.g. https://bidroom-backend.azurewebsites.net/api
      STRIPE_PUBLISHABLE_KEY  → pk_live_... (production) or pk_test_... (staging)

    Leave API_URL empty to use the default from environment.prod.ts / environment.ts.
  -->
  <script>
    window.APP_CONFIG = {
      /**
       * Local ng serve: '/api' (proxy.conf.json).
       * Azure SWA / production: use full backend URL (CI patches this on deploy).
       * Empty or relative on non-localhost hosts is ignored — see api.config.ts.
       */
      API_URL: '/api',
      // API_URL: 'https://bidroom-backend-dev.azurewebsites.net/api',
      STRIPE_PUBLISHABLE_KEY: 'pk_test_51TI5X806hw2O8NlNioZFt34bFn38uQPhm4hayUKZtrPf41BWH4xxdjiox9gNlMpSSHdUfCYtAM5FNX1UF3KyhNuP00Vqz8RtvH'
    };
  </script>
  <!-- Early theme (matches ThemeService): reduces flash before Angular boot -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('bidroom-theme-preference') || 'system';
        var r = p === 'light' ? 'light' : p === 'dark' ? 'dark' : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', r);
        document.documentElement.style.setProperty('color-scheme', r);
      } catch (e) {}
    })();
  </script>

  <!--
    Google tag (gtag.js) — the <script src> tag below is static and
    unconditional (per Google's own install instructions) so GA4's
    install-verification check, which reads the raw HTML, can detect it.
    The actual consent/config calls are gated to the production hostname
    below, since index.html is shared by every build (dev, e2e,
    ericeira-prod) — loading the idle library elsewhere is harmless, but
    we don't want dev/e2e traffic counted in the real GA4 property.
    Do not also create this script tag from TypeScript — that duplicates
    the library load and breaks the consent call ordering.
  -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4FDFR1ZSRV"></script>
  <script>
    (function () {
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;

      var h = location.hostname;
      if (h !== 'www.bidroom.pt' && h !== 'bidroom.pt') return;

      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });
      gtag('js', new Date());
      gtag('config', 'G-4FDFR1ZSRV', { send_page_view: false });
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
