  <!--
    APP_CONFIG overrides Angular’s environment.defaultApiBaseUrl when set (non-empty).
    Azure Static Web Apps: use build-time substitution or SWA app settings + a small script.
      API_URL                 → e.g. https://bidroom-backend.azurewebsites.net/api
      STRIPE_PUBLISHABLE_KEY  → pk_live_... (production) or pk_test_... (staging)

    Leave API_URL empty to use the default from environment.prod.ts / environment.ts.
  -->
  <script>
    window.APP_CONFIG = {
      /**
       * Local ng serve: '/api' (proxy.conf.json).
       * Azure SWA / production: use full backend URL (CI patches this on deploy).
       * Empty or relative on non-localhost hosts is ignored — see api.config.ts.
       */
      API_URL: '/api',
      // API_URL: 'https://bidroom-backend-dev.azurewebsites.net/api',
      STRIPE_PUBLISHABLE_KEY: 'pk_test_51TI5X806hw2O8NlNioZFt34bFn38uQPhm4hayUKZtrPf41BWH4xxdjiox9gNlMpSSHdUfCYtAM5FNX1UF3KyhNuP00Vqz8RtvH'
    };
  </script>
  <!-- Early theme (matches ThemeService): reduces flash before Angular boot -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('bidroom-theme-preference') || 'system';
        var r = p === 'light' ? 'light' : p === 'dark' ? 'dark' : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', r);
        document.documentElement.style.setProperty('color-scheme', r);
      } catch (e) {}
    })();
  </script>

  <!-- Google Analytics loaded by AnalyticsService after analytics cookie consent -->
</head>
<body>
  <app-root></app-root>
</body>
