<div class="check-email-container">
  <div class="check-email-card">
    <div class="icon-wrapper">
      <span class="icon">✉️</span>
    </div>
    <h1 class="title">{{ 'auth.checkEmail.title' | translate }}</h1>
    <p class="message">
      {{ 'auth.checkEmail.sentTo' | translate }}
      @if (email) {
<strong>{{ email }}</strong>
}
      @if (!email) {
<span>{{ 'auth.checkEmail.yourEmail' | translate }}</span>
}.
    </p>
    <p class="instructions">
      {{ 'auth.checkEmail.instructions' | translate }}
    </p>
    <p class="hint">
      {{ 'auth.checkEmail.hint' | translate }}
    </p>
    <button type="button" class="login-btn" (click)="goToLogin()">
      {{ 'auth.verifyEmail.goToLogin' | translate }}
    </button>
  </div>
</div>
