<div class="verify-email-container">
  <div class="verify-email-card">
    <!-- Header -->
    <div class="header">
      <h1 class="logo">.bubble</h1>
    </div>

    <!-- Loading State -->
    <div class="loading-state" *ngIf="isLoading">
      <div class="spinner"></div>
      <h2 class="title">Verifying your email...</h2>
      <p class="subtitle">Please wait while we verify your email address.</p>
    </div>

    <!-- Success State -->
    <div class="success-state" *ngIf="isVerified && !isLoading">
      <div class="success-icon">✓</div>
      <h2 class="title">Email verified successfully!</h2>
      <p class="subtitle">Your email address has been verified. You can now log in to your account.</p>
      <button class="login-btn" (click)="navigateToLogin()">Go to login</button>
    </div>

    <!-- Error State -->
    <div class="error-state" *ngIf="errorMessage && !isLoading">
      <div class="error-icon">✗</div>
      <h2 class="title">Verification failed</h2>
      <p class="subtitle">{{ errorMessage }}</p>
      <button class="login-btn" (click)="navigateToLogin()">Go to login</button>
    </div>
  </div>
</div>
