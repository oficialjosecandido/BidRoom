<div class="signup-container">
  <div class="signup-card">
    
    <!-- Title -->
    <h2 class="title">Create your Bidroom account</h2>

    

    

    <!-- Error Message -->
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <!-- Signup Form -->
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form">
      <!-- Name Fields -->
      <div class="name-row">
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input
            type="text"
            id="firstName"
            formControlName="firstName"
            [class.error]="getFieldError('firstName')"
            placeholder="First name"
            autocomplete="given-name"
          />
          <div class="field-error" *ngIf="getFieldError('firstName')">
            {{ getFieldError('firstName') }}
          </div>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input
            type="text"
            id="lastName"
            formControlName="lastName"
            [class.error]="getFieldError('lastName')"
            placeholder="Last name"
            autocomplete="family-name"
          />
          <div class="field-error" *ngIf="getFieldError('lastName')">
            {{ getFieldError('lastName') }}
          </div>
        </div>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email *</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          [class.error]="getFieldError('email')"
          placeholder="Enter your email"
          autocomplete="email"
        />
        <div class="field-error" *ngIf="getFieldError('email')">
          {{ getFieldError('email') }}
        </div>
      </div>

      <!-- Password Fields -->
      <div class="form-group">
        <label for="password">Password *</label>
        <div class="password-input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            [class.error]="getFieldError('password')"
            placeholder="Create a password"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <span class="eye-icon" [class.show]="showPassword">👁️</span>
          </button>
        </div>
        <div class="field-error" *ngIf="getFieldError('password')">
          {{ getFieldError('password') }}
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password *</label>
        <div class="password-input-container">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            formControlName="confirmPassword"
            [class.error]="getFieldError('confirmPassword')"
            placeholder="Confirm your password"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleConfirmPasswordVisibility()"
            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
          >
            <span class="eye-icon" [class.show]="showConfirmPassword">👁️</span>
          </button>
        </div>
        <div class="field-error" *ngIf="getFieldError('confirmPassword')">
          {{ getFieldError('confirmPassword') }}
        </div>
      </div>

      <!-- Signup Button -->
      <button
        type="submit"
        class="signup-btn"
        [disabled]="signupForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Sign up</span>
        <span *ngIf="isLoading">Creating account...</span>
      </button>
    </form>

    <!-- Login Link -->
    <div class="login-link">
      Already have an account? 
      <button type="button" (click)="navigateToLogin()">Log in</button>
    </div>
  </div>
</div>
