<div class="reset-password-container">
  <div class="reset-password-card">
    <!-- Header -->
    <div class="header">
      <h1 class="logo">.bubble</h1>
    </div>

    <!-- Title -->
    <h2 class="title">Reset your password</h2>
    <p class="subtitle">Enter your new password below.</p>

    <!-- Error Message -->
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <!-- Reset Password Form -->
    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="reset-password-form" *ngIf="token && !successMessage">
      <!-- New Password Field -->
      <div class="form-group">
        <label for="password">New Password *</label>
        <div class="password-input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            [class.error]="getFieldError('password')"
            placeholder="Enter your new password"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <span class="eye-icon" [class.show]="showPassword">👁️</span>
          </button>
        </div>
        <div class="field-error" *ngIf="getFieldError('password')">
          {{ getFieldError('password') }}
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password *</label>
        <div class="password-input-container">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            formControlName="confirmPassword"
            [class.error]="getFieldError('confirmPassword')"
            placeholder="Confirm your new password"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleConfirmPasswordVisibility()"
            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
          >
            <span class="eye-icon" [class.show]="showConfirmPassword">👁️</span>
          </button>
        </div>
        <div class="field-error" *ngIf="getFieldError('confirmPassword')">
          {{ getFieldError('confirmPassword') }}
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="submit-btn"
        [disabled]="resetPasswordForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Reset password</span>
        <span *ngIf="isLoading">Resetting...</span>
      </button>
    </form>

    <!-- Back to Login -->
    <div class="back-to-login">
      <button type="button" (click)="navigateToLogin()">Back to login</button>
    </div>
  </div>
</div>
