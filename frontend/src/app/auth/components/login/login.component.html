<div class="login-container">
  <div class="login-card">
    

    <!-- Title -->
    <h2 class="title">Log into your Bidroom account</h2>

    <!-- Error Message -->
    <div class="error-message" *ngIf="errorMessage">
      <div class="error-icon">⚠️</div>
      <div class="error-content">
        <p class="error-text">{{ errorMessage }}</p>
        <div class="error-actions" *ngIf="errorMessage.includes('No account found') || errorMessage.includes('Incorrect password')">
          <button type="button" class="action-link" (click)="navigateToSignup()" *ngIf="errorMessage.includes('No account found')">Sign up</button>
          <button type="button" class="action-link" (click)="navigateToForgotPassword()" *ngIf="errorMessage.includes('Incorrect password') || errorMessage.includes('Too many failed')">Reset password</button>
        </div>
      </div>
    </div>

    <!-- Google Login Button -->
    <button
      type="button"
      class="google-btn"
      (click)="loginWithGoogle()"
      [disabled]="isLoading"
    >
      <svg class="google-icon" width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.712 0-.595.102-1.172.282-1.712V4.956H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.044l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.956L3.964 7.288C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <!-- Separator -->
    <div class="separator">
      <span>or</span>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email *</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          [class.error]="getFieldError('email')"
          placeholder="Enter your email"
          autocomplete="email"
        />
        <div class="field-error" *ngIf="getFieldError('email')">
          {{ getFieldError('email') }}
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password *</label>
        <div class="password-input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            [class.error]="getFieldError('password')"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <span class="eye-icon" [class.show]="showPassword">👁️</span>
          </button>
        </div>
        <div class="field-error" *ngIf="getFieldError('password')">
          {{ getFieldError('password') }}
        </div>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="login-btn"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Log in</span>
        <span *ngIf="isLoading">Logging in...</span>
      </button>

      <!-- Forgot Password Link -->
      <button type="button" class="forgot-password-link" (click)="navigateToForgotPassword()">
        Reset password
      </button>
    </form>

    <!-- Sign Up Button -->
    <button class="signup-btn" (click)="navigateToSignup()">
      Sign up
    </button>
  </div>
</div>
