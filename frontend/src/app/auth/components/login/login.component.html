<div class="login-container">
  <div class="login-card">
    

    <!-- Title -->
    <h2 class="title">Log into your Bidroom account</h2>

    

    

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email *</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          [class.error]="getFieldError('email')"
          placeholder="Enter your email"
          autocomplete="email"
        />
        <div class="field-error" *ngIf="getFieldError('email')">
          {{ getFieldError('email') }}
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password *</label>
        <div class="password-input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            [class.error]="getFieldError('password')"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <span class="eye-icon" [class.show]="showPassword">👁️</span>
          </button>
        </div>
        <div class="field-error" *ngIf="getFieldError('password')">
          {{ getFieldError('password') }}
        </div>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="login-btn"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Log in</span>
        <span *ngIf="isLoading">Logging in...</span>
      </button>

      <!-- Forgot Password Link -->
      <button type="button" class="forgot-password-link" (click)="navigateToForgotPassword()">
        Reset password
      </button>
    </form>

    <!-- Sign Up Button -->
    <button class="signup-btn" (click)="navigateToSignup()">
      Sign up
    </button>
  </div>
</div>
