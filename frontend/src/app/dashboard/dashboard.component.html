<div class="dashboard-container">
  <!-- Sidebar Navigation -->
  <aside class="sidebar" [class.sidebar--collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <h1 class="logo" (click)="navigateToLanding()">
        <span class="logo-full">BidRoom</span>
        <span class="logo-short" aria-hidden="true">BR</span>
      </h1>
      <div class="sidebar-header-actions">
        <app-proposal-notifications></app-proposal-notifications>
        <button type="button" class="sidebar-toggle" (click)="toggleSidebar()" [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'" [attr.aria-expanded]="!sidebarCollapsed">
          <span class="toggle-icon" aria-hidden="true">{{ sidebarCollapsed ? '›' : '‹' }}</span>
        </button>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard/home" routerLinkActive="active" class="nav-item" title="Home">
        <span class="nav-icon">🏠</span>
        <span class="nav-text">Home</span>
      </a>

      <div class="nav-section-label"><span class="nav-text">Activity</span></div>

      <a routerLink="/dashboard/buyer" routerLinkActive="active" class="nav-item" title="Buyer Profile">
        <span class="nav-icon">🛒</span>
        <span class="nav-text">Buyer Profile</span>
      </a>
      <a routerLink="/dashboard/seller" routerLinkActive="active" class="nav-item" title="Seller Profile">
        <span class="nav-icon">📦</span>
        <span class="nav-text">Seller Profile</span>
      </a>

      <div class="nav-section-label"><span class="nav-text">Account</span></div>

      <a routerLink="/dashboard/notifications" routerLinkActive="active" class="nav-item nav-item-with-badge" title="Notifications">
        <span class="nav-icon">🔔</span>
        <span class="nav-text">Notifications</span>
        @if (notificationUnreadCount > 0) {
          <span class="nav-badge">{{ notificationUnreadCount > 99 ? '99+' : notificationUnreadCount }}</span>
        }
      </a>
      <a routerLink="/dashboard/settings" routerLinkActive="active" class="nav-item" title="Settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-text">Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="logout-btn" (click)="logout()" title="Logout">
        <span class="nav-icon">🚪</span>
        <span class="nav-text">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="dashboard-main" [class.dashboard-main--collapsed]="sidebarCollapsed">
    <router-outlet></router-outlet>
  </main>
</div>
