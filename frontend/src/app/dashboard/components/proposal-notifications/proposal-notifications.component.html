<div class="proposal-notifications">
  <button
    type="button"
    class="notification-trigger"
    (click)="toggleDropdown()"
    [attr.aria-expanded]="dropdownOpen"
    [attr.aria-label]="unreadCount > 0 ? unreadCount + ' new notification(s)' : 'Notifications'">
    <span class="notification-icon" aria-hidden="true">🔔</span>
    @if (unreadCount > 0) {
      <span class="notification-badge">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
    }
  </button>

  @if (dropdownOpen) {
    <div class="notification-dropdown">
      <div class="dropdown-header">
        <h3 class="dropdown-title">Notifications</h3>
        @if (unreadCount > 0) {
          <button type="button" class="mark-all-btn" (click)="markAllAsRead()">Mark all read</button>
        }
      </div>
      <div class="dropdown-body">
        @if (loading) {
          <div class="dropdown-loading">
            <span class="loading-spinner"></span>
            <p>Loading...</p>
          </div>
        } @else if (notifications.length === 0) {
          <div class="dropdown-empty">
            <span class="empty-icon">🔔</span>
            <p>No notifications yet</p>
            <a routerLink="/dashboard/notifications" class="view-all-btn" (click)="closeDropdown()">View notifications</a>
          </div>
        } @else {
          <ul class="notification-list">
            @for (notification of notifications; track notification._id) {
              <li class="notification-item" [class.unread]="notification.status === 'unread'" [class.read]="notification.status === 'read'">
                <button
                  type="button"
                  class="notification-link"
                  (click)="openNotification(notification)">
                  <span class="notification-type-icon">{{ getTypeIcon(notification.type) }}</span>
                  <div class="notification-content">
                    <span class="notification-title">{{ notification.title }}</span>
                    <span class="notification-message">{{ notification.message }}</span>
                    <span class="notification-time">{{ formatDate(notification.issuedAt) }}</span>
                  </div>
                </button>
              </li>
            }
          </ul>
          <div class="dropdown-footer">
            <a routerLink="/dashboard/notifications" class="view-all-btn" (click)="closeDropdown()">View all notifications</a>
          </div>
        }
      </div>
    </div>
  }
</div>
