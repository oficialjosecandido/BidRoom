@if (visible()) {
  <div class="cookie-banner" role="dialog" aria-labelledby="cookie-banner-title" aria-live="polite">
    <div class="cookie-banner__body">
      <div id="cookie-banner-title" class="cookie-banner__title">{{ 'legal.banner.title' | translate }}</div>
      <p class="cookie-banner__text">
        {{ 'legal.banner.text' | translate }}
        <button type="button" class="cookie-banner__link" (click)="openCookies()">
          {{ 'legal.banner.learnMore' | translate }}
        </button>
      </p>
    </div>
    <div class="cookie-banner__actions">
      <button type="button" class="cookie-banner__btn cookie-banner__btn--reject" (click)="rejectNonEssential()">
        {{ 'legal.banner.reject' | translate }}
      </button>
      <button type="button" class="cookie-banner__btn cookie-banner__btn--accept" (click)="acceptAll()">
        {{ 'legal.banner.accept' | translate }}
      </button>
    </div>
  </div>
}
