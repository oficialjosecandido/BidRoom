<svg
  class="bidroom-logo"
  [class.bidroom-logo--animated]="animated"
  [attr.data-variant]="variant"
  [attr.viewBox]="variant === 'horizontal' ? '0 0 220 56' : variant === 'vertical' ? '0 0 120 110' : '0 0 64 64'"
  [style.height.px]="height"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="BidRoom"
>
  @if (variant === 'horizontal') {
    <circle class="arc-ghost" cx="28" cy="28" r="22" fill="none" stroke-width="1.5"/>
    <circle class="arc-fill" cx="28" cy="28" r="22" fill="none" stroke-width="3"
            stroke-linecap="round" transform="rotate(-90 28 28)"/>
    <circle class="arc-dot" cx="50" cy="28" r="5"/>
    <text class="mono-text" x="28" y="34" font-weight="700" font-size="13" text-anchor="middle" letter-spacing="-.5">BR</text>
    <text class="wordmark" x="68" y="33" font-weight="600" font-size="22" letter-spacing="-.5">BidRoom</text>
    @if (showPt) {
      <text class="pt-suffix" x="189" y="22" font-weight="500" font-size="11">.pt</text>
    }
  } @else if (variant === 'vertical') {
    <circle class="arc-ghost" cx="60" cy="46" r="34" fill="none" stroke-width="1.5"/>
    <circle class="arc-fill" cx="60" cy="46" r="34" fill="none" stroke-width="3.5"
            stroke-linecap="round" transform="rotate(-90 60 46)"/>
    <circle class="arc-dot" cx="94" cy="46" r="6"/>
    <text class="mono-text" x="60" y="52" font-weight="700" font-size="18" text-anchor="middle" letter-spacing="-.5">BR</text>
    <text class="wordmark" x="60" y="90" font-weight="600" font-size="20" text-anchor="middle" letter-spacing="-.3">BidRoom</text>
    @if (showPt) {
      <text class="pt-suffix" x="60" y="106" font-weight="500" font-size="11" text-anchor="middle">.pt</text>
    }
  } @else {
    <circle class="arc-ghost" cx="32" cy="32" r="26" fill="none" stroke-width="1.5"/>
    <circle class="arc-fill" cx="32" cy="32" r="26" fill="none" stroke-width="3.5"
            stroke-linecap="round" transform="rotate(-90 32 32)"/>
    <circle class="arc-dot" cx="58" cy="32" r="5.5"/>
    <text class="mono-text" x="32" y="38" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="-.3">BR</text>
  }
</svg>
