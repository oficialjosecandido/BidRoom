@if (visible()) {
  <div class="pwa-install" role="dialog" aria-labelledby="pwa-install-title">
    <button type="button" class="pwa-install__close" (click)="dismiss()" [attr.aria-label]="'pwaInstall.close' | translate">×</button>
    <div class="pwa-install__icon" aria-hidden="true">B</div>
    <div class="pwa-install__body">
      <div id="pwa-install-title" class="pwa-install__title">{{ 'pwaInstall.title' | translate }}</div>
      @if (isIos()) {
        <p class="pwa-install__hint">
          {{ 'pwaInstall.iosPrefix' | translate }}
          <span class="pwa-install__share" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 16V4m0 0l-4 4m4-4l4 4M5 20h14"/>
            </svg>
          </span>
          {{ 'pwaInstall.iosSuffix' | translate }}
        </p>
      } @else {
        <p class="pwa-install__hint">{{ 'pwaInstall.androidHint' | translate }}</p>
      }
    </div>
    @if (canNativeInstall()) {
      <button type="button" class="pwa-install__cta" (click)="install()">
        {{ 'pwaInstall.install' | translate }}
      </button>
    }
  </div>
}
