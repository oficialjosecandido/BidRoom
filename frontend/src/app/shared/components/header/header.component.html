<!-- Header -->
<header class="header">
  <div class="container">
    <div class="header-content">
      <div class="logo">
        <h1 (click)="navigateToHome()">BidRoom | DEV</h1>
      </div>
      
      <nav class="main-nav">
        <a class="nav-link" [class.active]="activePage === 'auctions'" (click)="navigateToAuctions()">Auctions</a>
        <a class="nav-link" [class.active]="activePage === 'categories'" (click)="navigateToCategories()">Categories</a>
        <a class="nav-link" [class.active]="activePage === 'how-it-works'" (click)="navigateToHowItWorks()">How It Works</a>
        <a class="nav-link" [class.active]="activePage === 'faq'" (click)="navigateToFaq()">FAQ</a>
        <a class="nav-link" [class.active]="activePage === 'contact'" (click)="navigateToContact()">Contact</a>
      </nav>
      
      <div class="header-actions">
        @if (isAuthenticated$ | async) {
          <button class="btn btn-secondary" (click)="navigateToAddListing()">List Your Item</button>
          <button class="btn btn-primary" (click)="navigateToDashboard()">My Account</button>
        } @else {
          <button class="btn btn-secondary" (click)="navigateToLogin()">Sign In</button>
          <button class="btn btn-primary" (click)="navigateToAuth()">Start Bidding</button>
        }
      </div>
    </div>
  </div>
</header>
