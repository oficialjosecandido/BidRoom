<header class="header">
  <div class="container">
    <div class="header-content">
      <!-- Logo -->
      <div class="logo">
        <a routerLink="/">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          <span class="logo-text">Bidroom.co</span>
        </a>
      </div>

      <!-- Navigation -->
      <nav class="nav">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="#how-it-works" class="nav-link">How It Works</a>
          </li>
          <li class="nav-item">
            <a href="#faq" class="nav-link">FAQ</a>
          </li>
          <li class="nav-item">
            <a href="#contact" class="nav-link">Contact</a>
          </li>
          <li class="nav-item">
            <a href="#categories" class="nav-link">Categories</a>
          </li>
        </ul>
      </nav>

      <!-- CTA Buttons -->
      <div class="header-actions">
        <!-- Not Authenticated -->
        <div *ngIf="!isAuthenticated" class="auth-buttons">
          <button class="btn btn-outline-light" (click)="navigateToLogin()">
            Login
          </button>
          <button class="btn btn-primary" (click)="navigateToRegister()">
            Register
          </button>
        </div>

        <!-- Authenticated -->
        <div *ngIf="isAuthenticated" class="user-menu">
          <div class="user-info">
            <span class="user-greeting">
              👋 Hello, {{ user?.firstName || user?.displayName || 'User' }}!
            </span>
          </div>
          <div class="user-actions">
            <button class="btn btn-outline-light" (click)="navigateToDashboard()">
              Dashboard
            </button>
            <button class="btn btn-primary" (click)="navigateToSell()">
              Sell Now
            </button>
            <button class="btn btn-secondary" (click)="logout()">
              Logout
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
