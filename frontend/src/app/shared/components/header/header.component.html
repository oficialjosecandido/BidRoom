<!-- Header -->
<header class="header">
  <!-- Backdrop when mobile menu is open (tap to close) -->
  <div
    class="menu-backdrop"
    [class.visible]="menuOpen"
    (click)="closeMenu()"
    (keydown.escape)="closeMenu()"
    role="button"
    tabindex="0"
    aria-label="Close menu"
  ></div>

  <div class="container">
    <div class="header-content">
        <div class="logo">
        <h1 role="button" tabindex="0" (click)="navigateToHome()" (keydown.enter)="navigateToHome()" (keydown.space)="navigateToHome()">BidRoom | DEV</h1>
      </div>

      <button
        type="button"
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        [class.open]="menuOpen"
        aria-label="{{ menuOpen ? 'Close menu' : 'Open menu' }}"
      >
        <span class="menu-toggle-icon" [class.open]="menuOpen">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </span>
      </button>
      
      <div class="nav-wrapper" [class.open]="menuOpen">
        <nav class="main-nav">
          <a class="nav-link" [class.active]="activePage === 'auctions'" href="#" role="button" (click)="navigateToAuctions(); $event.preventDefault()" (keydown.enter)="navigateToAuctions(); $event.preventDefault()">Auctions</a>
          <a class="nav-link" [class.active]="activePage === 'categories'" href="#" role="button" (click)="navigateToCategories(); $event.preventDefault()" (keydown.enter)="navigateToCategories(); $event.preventDefault()">Categories</a>
          <a class="nav-link" [class.active]="activePage === 'how-it-works'" href="#" role="button" (click)="navigateToHowItWorks(); $event.preventDefault()" (keydown.enter)="navigateToHowItWorks(); $event.preventDefault()">How It Works</a>
          <a class="nav-link" [class.active]="activePage === 'faq'" href="#" role="button" (click)="navigateToFaq(); $event.preventDefault()" (keydown.enter)="navigateToFaq(); $event.preventDefault()">FAQ</a>
          <a class="nav-link" [class.active]="activePage === 'contact'" href="#" role="button" (click)="navigateToContact(); $event.preventDefault()" (keydown.enter)="navigateToContact(); $event.preventDefault()">Contact</a>
        </nav>
        
        <div class="header-actions">
          @if (isAuthenticated$ | async) {
            <div class="header-notification-wrap">
              <app-proposal-notifications></app-proposal-notifications>
            </div>
            <button class="btn btn-secondary" (click)="navigateToAddListing()">List Your Item</button>
            <button class="btn btn-primary" (click)="navigateToDashboard()">My Account</button>
          } @else {
            <button class="btn btn-secondary" (click)="navigateToLogin()">Sign In</button>
            <button class="btn btn-primary" (click)="navigateToAuth()">Start Bidding</button>
          }
        </div>
      </div>
    </div>
  </div>
</header>
