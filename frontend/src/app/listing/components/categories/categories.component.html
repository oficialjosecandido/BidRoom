<app-header activePage="categories"></app-header>

<section class="categories-page">
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">{{ 'categories.title' | translate }}</h1>
      <p class="page-subtitle">{{ 'categories.subtitle' | translate }}</p>
      <button type="button" class="browse-all-btn" (click)="browseAll()">
        {{ 'categories.browseAll' | translate }} →
      </button>
    </div>

    <div class="categories-list">
      @for (category of categories; track category.id) {
        <article class="category-section">
          <div class="category-header">
            <button type="button" class="category-header-main" (click)="browseCategory(category.id)">
              <span class="category-icon" aria-hidden="true">{{ category.icon }}</span>
              <div class="category-info">
                <h2 class="category-name">{{ categoryTitleKey(category.id) | translate }}</h2>
                <p class="category-description">{{ categoryDescKey(category.id) | translate }}</p>
              </div>
            </button>
            <div class="category-header-actions">
              @if (isLoggedIn) {
                <button
                  type="button"
                  class="cat-follow-btn"
                  [class.cat-follow-btn--following]="followedCategories.has(category.id)"
                  [disabled]="followTogglingCategory === category.id"
                  (click)="toggleFollowCategory($event, category.id)"
                  [attr.title]="followedCategories.has(category.id) ? ('categories.unfollow' | translate) : ('categories.follow' | translate)">
                  {{ followedCategories.has(category.id) ? ('categories.following' | translate) : ('categories.follow' | translate) }}
                </button>
              }
              <span class="category-count">
                {{ 'categories.subcategoryCount' | translate:{ count: category.subCategories.length } }}
              </span>
              <button type="button" class="browse-arrow" (click)="browseCategory(category.id)">
                {{ 'categories.browseCategory' | translate }} →
              </button>
            </div>
          </div>

          <div class="subcategories-grid">
            @for (sub of category.subCategories; track sub) {
              <button type="button" class="subcategory-chip" (click)="browseSubCategory(category.id, sub)">
                {{ subCategoryLabelKey(sub) | translate }}
              </button>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>

<app-footer></app-footer>
