<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <!-- Subtle gradient overlay -->
  <radialGradient id="glow" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Gold arc logo -->
  <g transform="translate(552, 180)">
    <path d="M 8 68 A 48 48 0 1 1 88 68" stroke="#C9A84C" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="88" cy="68" r="10" fill="#C9A84C"/>
  </g>
  <!-- BidRoom wordmark -->
  <text x="600" y="328" font-family="'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#F0EDE8" text-anchor="middle" letter-spacing="-2">BidRoom</text>
  <!-- Domain -->
  <text x="600" y="378" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#C9A84C" text-anchor="middle" letter-spacing="2">.pt</text>
  <!-- Tagline -->
  <text x="600" y="450" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="300" fill="#888880" text-anchor="middle">Leilões premium em Portugal</text>
  <!-- Bottom border line -->
  <rect x="480" y="510" width="240" height="1" fill="#C9A84C" opacity="0.4"/>
</svg>
