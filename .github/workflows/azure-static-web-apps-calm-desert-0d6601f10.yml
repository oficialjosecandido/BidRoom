name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - ericeira-prod
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - ericeira-prod

env:
  API_URL: https://bidroom-backend-prod-e9eghtc0aha4e3dw.uksouth-01.azurewebsites.net/api
  BACKEND_ORIGIN: https://bidroom-backend-prod-e9eghtc0aha4e3dw.uksouth-01.azurewebsites.net

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps
      - name: Build Angular app (ericeira-prod)
        run: |
          cd frontend
          npm run build:ericeira-prod
      - name: Patch runtime config in built index.html
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          INDEX="frontend/dist/frontend/browser/index.html"
          if [ ! -f "$INDEX" ]; then
            echo "❌ Built index.html not found at $INDEX"
            exit 1
          fi

          # Patch API_URL
          sed -i "s|API_URL: '/api'|API_URL: '${API_URL}'|" "$INDEX"

          # Patch BACKEND_ORIGIN for Socket.IO
          sed -i "s|BACKEND_ORIGIN: ''|BACKEND_ORIGIN: '${BACKEND_ORIGIN}'|" "$INDEX" || true

          # Patch Stripe key — fail if secret not set (avoids shipping test key to prod)
          if [ -z "${STRIPE_PUBLISHABLE_KEY:-}" ]; then
            echo "❌ STRIPE_PUBLISHABLE_KEY secret is not set. Refusing to deploy with test key."
            exit 1
          fi
          awk -v k="$STRIPE_PUBLISHABLE_KEY" '
            { gsub(/STRIPE_PUBLISHABLE_KEY: '\''[^'\'']*'\''/, "STRIPE_PUBLISHABLE_KEY: '\''" k "'\''"); print }
          ' "$INDEX" > "$INDEX.tmp" && mv "$INDEX.tmp" "$INDEX"

          echo "✅ Patched runtime config:"
          grep -oE "(API_URL|STRIPE_PUBLISHABLE_KEY|BACKEND_ORIGIN): '[^']*'" "$INDEX" | sed -E "s/(STRIPE_PUBLISHABLE_KEY: ')([^']{8}).*$/\1\2…(redacted)/"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_DESERT_0D6601F10 }}
          action: "upload"
          app_location: "./frontend/dist/frontend/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_DESERT_0D6601F10 }}
