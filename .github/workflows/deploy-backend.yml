name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: bidroom-backend-dev
  AZURE_RESOURCE_GROUP: bidroom-dev-rg
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check for publish profile secret
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        run: |
          echo "❌ AZURE_WEBAPP_PUBLISH_PROFILE secret is not set!"
          echo "Please add it in GitHub Settings → Secrets and variables → Actions"
          exit 1
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../backend-deploy.zip . \
            -x "*.git*" \
            -x "*node_modules*" \
            -x "*.log" \
            -x "*.env*" \
            -x "*.example" \
            -x "*.md" \
            -x "*test*" \
            -x "*.test.js" \
            -x "*.spec.js"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend-deploy.zip

      - name: Restart Azure Web App
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

