name: Deploy Backend (prod) to Azure

on:
  push:
    branches:
      - ericeira-prod
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-prod.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: bidroom-backend-prod
  AZURE_RESOURCE_GROUP: bidroom-dev-rg
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../backend-deploy.zip . \
            -x "*.git*" \
            -x "*.log" \
            -x "*.env*" \
            -x "*.example" \
            -x "*.md" \
            -x "*test*" \
            -x "*.test.js" \
            -x "*.spec.js"
          echo "Package size: $(du -sh ../backend-deploy.zip | cut -f1)"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (prod)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./backend-deploy.zip
