# DISABLED — superseded by ericeira-prod_bidroom-backend-prod.yml
#
# That workflow uses Azure OIDC (AZUREAPPSERVICE_* secrets) and deploys
# successfully to bidroom-backend-prod on every push to ericeira-prod.
#
# This file used AZURE_CREDENTIALS + resource group bidroom-dev-rg. That
# service principal no longer sees Microsoft.Web/Sites/bidroom-backend-prod
# ("Resource … doesn't exist"), so every run failed while the OIDC deploy
# still succeeded — confusing red Xes on the same commit.
#
# Kept for history. Do not re-enable without aligning credentials + app name
# with the live App Service. Prefer the OIDC workflow above.
name: Deploy Backend (prod) to Azure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ENABLE only if you intentionally want this legacy path'
        required: true
        default: ''

jobs:
  skipped:
    if: ${{ github.event.inputs.confirm == 'ENABLE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy deploy
        run: |
          echo "::error::deploy-backend-prod.yml is retired. Use workflow 'Build and deploy Node.js app to Azure Web App - bidroom-backend-prod' (ericeira-prod_bidroom-backend-prod.yml)."
          exit 1
