name: Deploy Frontend to Azure App Service (SSR)

on:
  push:
    branches:
      - main
      - ericeira-prod
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  AZURE_WEBAPP_NAME: bidroom-frontend-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      # Patched BEFORE the build, on the source template.
      #
      # This used to run after the build, on dist/…/index.csr.html and
      # index.server.html. Those two files are not what the SSR engine serves:
      # the build bakes a copy of the index into server/assets-chunks/
      # index_csr_html.mjs and index_server_html.mjs, and angular-app-manifest
      # .mjs resolves 'index.csr.html' to the chunk. So the patch reported ✅,
      # the files on disk really did say pk_live_, and production served the
      # pk_test_ frozen into the bundle — every buyer's card failed against a
      # live SetupIntent, and the test-only "Simulate verification" button
      # showed to real sellers.
      #
      # Patching the source removes the class of bug: whatever the build emits,
      # emits from the patched input, with its own hashes computed over it.
      - name: Patch runtime config in the source template
        env:
          API_URL: https://bidroom-backend-prod-e9eghtc0aha4e3dw.uksouth-01.azurewebsites.net/api
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          INDEX="frontend/src/index.html"

          # Fail hard if the secret is missing, so we never silently ship the
          # test key that sits in the source as the local-dev default.
          if [ -z "${STRIPE_PUBLISHABLE_KEY:-}" ]; then
            echo "❌ STRIPE_PUBLISHABLE_KEY secret is not set. Refusing to deploy with the test key."
            exit 1
          fi

          # Emptiness was never the thing that mattered — the mode is.
          if [ "${{ github.ref_name }}" = "ericeira-prod" ] && \
             [ "${STRIPE_PUBLISHABLE_KEY#pk_live_}" = "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "❌ STRIPE_PUBLISHABLE_KEY is not a pk_live_ key, and this is the production branch."
            echo "   Set the secret to the live publishable key of the platform Stripe account."
            exit 1
          fi

          sed -i "s|API_URL: '/api'|API_URL: '${API_URL}'|" "$INDEX"
          awk -v k="$STRIPE_PUBLISHABLE_KEY" '
            { gsub(/STRIPE_PUBLISHABLE_KEY: '\''[^'\'']*'\''/, "STRIPE_PUBLISHABLE_KEY: '\''" k "'\''"); print }
          ' "$INDEX" > "$INDEX.tmp" && mv "$INDEX.tmp" "$INDEX"

          echo "✅ Patched runtime config in $INDEX:"
          grep -oE "(API_URL|STRIPE_PUBLISHABLE_KEY): '[^']*'" "$INDEX" \
            | sed -E "s/(STRIPE_PUBLISHABLE_KEY: ')([^']{8}).*$/\1\2…(redacted)/"

      - name: Build Angular SSR app
        run: |
          cd frontend
          if [ "${{ github.ref_name }}" = "dev" ]; then
            npx ng build --configuration=development
          elif [ "${{ github.ref_name }}" = "ericeira-prod" ]; then
            npm run build:ericeira-prod
          else
            npm run build
          fi

      # Checked on the files that are actually served, not the ones we edited.
      # The previous check passed on a build that shipped the test key.
      - name: Verify the shipped artifact carries the live key
        run: |
          set -euo pipefail

          DIST="frontend/dist/frontend"
          SERVED="$DIST/server/assets-chunks/index_csr_html.mjs \
                  $DIST/server/assets-chunks/index_server_html.mjs \
                  $DIST/browser/index.csr.html \
                  $DIST/server/index.server.html"

          for f in $SERVED; do
            if [ ! -f "$f" ]; then
              echo "❌ Expected build output missing: $f"
              echo "   If Angular changed its output layout, this check needs updating —"
              echo "   do not delete it, or the test key ships again."
              exit 1
            fi
            [ "${{ github.ref_name }}" = "ericeira-prod" ] || continue

            # A real key, not the literal "pk_test_..." in the explanatory
            # comment in index.html, which survives the build as prose.
            if grep -qE "pk_test_[A-Za-z0-9]" "$f"; then
              echo "❌ $f still contains a pk_test_ key after the build."
              exit 1
            fi
            if ! grep -q "STRIPE_PUBLISHABLE_KEY: 'pk_live_" "$f"; then
              echo "❌ $f has no live publishable key in APP_CONFIG."
              echo "   The patch step ran before the build — did the placeholder in"
              echo "   frontend/src/index.html change shape?"
              exit 1
            fi
          done

          echo "✅ Live key present in everything served, no test key anywhere. Entry point:"
          ls -la "$DIST/server/server.mjs"

      - name: Create deployment package
        run: |
          cd frontend/dist/frontend
          # Package both browser assets and the SSR server bundle.
          # The server is self-contained (esbuild-bundled) — no node_modules needed.
          # Layout after extraction to wwwroot/:
          #   browser/   → static assets served by express.static
          #   server/    → SSR engine; startup: node server/server.mjs
          zip -r ../../../frontend-deploy.zip browser/ server/
          echo "📊 Deployment package size: $(du -sh ../../../frontend-deploy.zip | cut -f1)"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service settings
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group bidroom-dev-rg \
            --settings \
              NODE_ENV=production \
              NG_ALLOWED_HOSTS="${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net,bidroom.pt,www.bidroom.pt"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./frontend-deploy.zip
          startup-command: 'node server/server.mjs'
