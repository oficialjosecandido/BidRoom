name: Deploy Frontend to Azure App Service (SSR)

on:
  push:
    branches:
      - main
      - dev
      - ericeira-prod
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  AZURE_WEBAPP_NAME: bidroom-frontend-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Build Angular SSR app
        run: |
          cd frontend
          if [ "${{ github.ref_name }}" = "dev" ]; then
            npx ng build --configuration=development
          elif [ "${{ github.ref_name }}" = "ericeira-prod" ]; then
            npm run build:ericeira-prod
          else
            npm run build
          fi

      - name: Patch runtime config in built HTML templates
        env:
          API_URL: https://bidroom-backend-prod-e9eghtc0aha4e3dw.uksouth-01.azurewebsites.net/api
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          # The SSR build produces two HTML templates that both need APP_CONFIG patched:
          #   browser/index.csr.html  — shell served for RenderMode.Client routes
          #   server/index.server.html — template used by the SSR engine (affects <head> OG tags)
          BROWSER_HTML="frontend/dist/frontend/browser/index.csr.html"
          SERVER_HTML="frontend/dist/frontend/server/index.server.html"

          for INDEX in "$BROWSER_HTML" "$SERVER_HTML"; do
            if [ ! -f "$INDEX" ]; then
              echo "❌ Built template not found at $INDEX"
              exit 1
            fi

            # Replace API_URL placeholder
            sed -i "s|API_URL: '/api'|API_URL: '${API_URL}'|" "$INDEX"

            # Replace Stripe publishable key — fail hard if the secret is missing so
            # we never silently ship the test key to production users.
            if [ -z "${STRIPE_PUBLISHABLE_KEY:-}" ]; then
              echo "❌ STRIPE_PUBLISHABLE_KEY secret is not set. Refusing to deploy with the test key."
              exit 1
            fi
            awk -v k="$STRIPE_PUBLISHABLE_KEY" '
              { gsub(/STRIPE_PUBLISHABLE_KEY: '\''[^'\'']*'\''/, "STRIPE_PUBLISHABLE_KEY: '\''" k "'\''"); print }
            ' "$INDEX" > "$INDEX.tmp" && mv "$INDEX.tmp" "$INDEX"
          done

          echo "✅ Patched runtime config in both HTML templates:"
          grep -oE "(API_URL|STRIPE_PUBLISHABLE_KEY): '[^']*'" "$BROWSER_HTML" \
            | sed -E "s/(STRIPE_PUBLISHABLE_KEY: ')([^']{8}).*$/\1\2…(redacted)/"

      - name: Verify build output
        run: |
          echo "📂 browser/ HTML:"
          ls -la frontend/dist/frontend/browser/index.csr.html
          echo "📂 server/ HTML:"
          ls -la frontend/dist/frontend/server/index.server.html
          echo "📂 server/ entry:"
          ls -la frontend/dist/frontend/server/server.mjs

      - name: Create deployment package
        run: |
          cd frontend/dist/frontend
          # Package both browser assets and the SSR server bundle.
          # The server is self-contained (esbuild-bundled) — no node_modules needed.
          # Layout after extraction to wwwroot/:
          #   browser/   → static assets served by express.static
          #   server/    → SSR engine; startup: node server/server.mjs
          zip -r ../../../frontend-deploy.zip browser/ server/
          echo "📊 Deployment package size: $(du -sh ../../../frontend-deploy.zip | cut -f1)"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service settings
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group bidroom-dev-rg \
            --settings \
              NODE_ENV=production \
              NG_ALLOWED_HOSTS="${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net,bidroom.pt,www.bidroom.pt"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./frontend-deploy.zip
          startup-command: 'node server/server.mjs'
