name: Deploy Frontend to Azure Static Web App

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Build Angular app
        run: |
          cd frontend
          # dev branch → development config (shows test durations, non-production flags)
          # main branch → production config (hides test-only features)
          if [ "${{ github.ref_name }}" = "dev" ]; then
            npx ng build --configuration=development
          else
            npm run build
          fi
        env:
          # Set API URL for production build
          API_URL: ${{ vars.API_URL || 'https://bidroom-backend-dev.azurewebsites.net/api' }}

      - name: Patch runtime config in built index.html
        env:
          API_URL: ${{ vars.API_URL || 'https://bidroom-backend-dev.azurewebsites.net/api' }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          INDEX="frontend/dist/frontend/browser/index.html"
          if [ ! -f "$INDEX" ]; then
            echo "❌ Built index.html not found at $INDEX"
            exit 1
          fi

          # Replace API_URL placeholder (default in index.html is '/api')
          sed -i "s|API_URL: '/api'|API_URL: '${API_URL}'|" "$INDEX"

          # Replace Stripe publishable key. Fails the build if the secret was not set,
          # otherwise we would silently ship the dev/test key to production users.
          if [ -z "${STRIPE_PUBLISHABLE_KEY:-}" ]; then
            echo "❌ STRIPE_PUBLISHABLE_KEY secret is not set in GitHub Actions. Refusing to deploy with the test key embedded in index.html."
            exit 1
          fi
          # Use a delimiter unlikely to appear inside the key; awk avoids sed escaping headaches.
          awk -v k="$STRIPE_PUBLISHABLE_KEY" '
            { gsub(/STRIPE_PUBLISHABLE_KEY: '\''[^'\'']*'\''/, "STRIPE_PUBLISHABLE_KEY: '\''" k "'\''"); print }
          ' "$INDEX" > "$INDEX.tmp" && mv "$INDEX.tmp" "$INDEX"

          echo "✅ Patched runtime config:"
          grep -oE "(API_URL|STRIPE_PUBLISHABLE_KEY): '[^']*'" "$INDEX" | sed -E "s/(STRIPE_PUBLISHABLE_KEY: ')([^']{8}).*$/\1\2…(redacted)/"

      - name: Verify build output
        run: |
          echo "Build output location:"
          ls -la frontend/dist/frontend/browser/index.html
          echo ""
          echo "Files in build output:"
          ls -la frontend/dist/frontend/browser/ | head -10

      - name: Prepare deployment directory
        run: |
          # Clean up frontend directory, keep only dist output
          # Azure Static Web Apps has a 250MB limit
          echo "📦 Preparing deployment directory..."
          
          # Create a temporary directory for deployment
          mkdir -p deploy
          
          # Copy only the built files (not source files)
          cp -r frontend/dist/frontend/browser/* deploy/
          
          # Copy staticwebapp.config.json if it exists (needed for SPA routing)
          if [ -f "frontend/staticwebapp.config.json" ]; then
            cp frontend/staticwebapp.config.json deploy/
            echo "✅ Copied staticwebapp.config.json"
          fi
          
          # Calculate size
          echo "📊 Deployment size:"
          du -sh deploy
          du -sh deploy/* | head -10
          
          echo "✅ Deployment files ready in deploy/"
          ls -la deploy/index.html
          ls -la deploy/staticwebapp.config.json 2>/dev/null || echo "⚠️  staticwebapp.config.json not found"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/deploy"
          api_location: "api"
          output_location: ""
          skip_app_build: true

