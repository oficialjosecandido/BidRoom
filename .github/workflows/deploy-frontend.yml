name: Deploy Frontend to Azure Static Web App

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Angular app
        run: |
          cd frontend
          npm run build
        env:
          # Set API URL for production build
          API_URL: https://bidroom-backend-dev.azurewebsites.net/api

      - name: Verify build output
        run: |
          echo "Build output location:"
          ls -la frontend/dist/frontend/browser/index.html
          echo ""
          echo "Files in build output:"
          ls -la frontend/dist/frontend/browser/ | head -10

      - name: Prepare deployment directory
        run: |
          # Clean up frontend directory, keep only dist output
          # Azure Static Web Apps has a 250MB limit
          echo "📦 Preparing deployment directory..."
          
          # Create a temporary directory for deployment
          mkdir -p deploy
          
          # Copy only the built files (not source files)
          cp -r frontend/dist/frontend/browser/* deploy/
          
          # Calculate size
          echo "📊 Deployment size:"
          du -sh deploy
          du -sh deploy/* | head -10
          
          echo "✅ Deployment files ready in deploy/"
          ls -la deploy/index.html

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "deploy"
          skip_app_build: true

