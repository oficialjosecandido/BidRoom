name: Deploy Frontend to Azure Static Web App

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Angular app
        run: |
          cd frontend
          npm run build
        env:
          # Set API URL for production build
          API_URL: https://bidroom-backend-dev.azurewebsites.net/api

      - name: Verify build output
        run: |
          echo "Build output location:"
          ls -la frontend/dist/frontend/browser/index.html
          echo ""
          echo "Files in build output:"
          ls -la frontend/dist/frontend/browser/ | head -10

      - name: Copy build output to deployment location
        run: |
          # Copy build output to a location Azure Static Web Apps expects
          mkdir -p dist
          cp -r frontend/dist/frontend/browser/* dist/
          echo "✅ Copied build output to dist/"
          ls -la dist/index.html

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          output_location: "dist"
          skip_app_build: true

