name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

env:
  # CVE-2026-111497 (Brotli RCE) — pin patched 22 LTS; 20.x is EOL with no fix.
  NODE_VERSION: '22.23.4'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run unit tests
        timeout-minutes: 5
        run: |
          cd backend
          npm run test:ci

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Build frontend (acts as the smoke test until karma is set up)
        timeout-minutes: 10
        run: |
          cd frontend
          npm run build

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Gates on critical only, deliberately. Both trees carry a long tail of
      # high/moderate advisories inside transitive deps (OpenTelemetry, the
      # Firebase and socket.io stacks) whose fixes are not ours to ship, so a
      # --audit-level=high gate would be red on every PR and get ignored within
      # a week. Critical is the level where we stop and deal with it.
      #
      # --omit=dev because a build-time advisory does not reach production, and
      # no install is needed: npm audit reads the lockfile.
      - name: Audit backend dependencies
        run: |
          cd backend
          npm audit --audit-level=critical --omit=dev

      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --audit-level=critical --omit=dev

