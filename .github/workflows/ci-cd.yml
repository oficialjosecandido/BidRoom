name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: bidroom-rg
  AKS_CLUSTER: bidroom-aks-prod

jobs:
  # Backend Tests and Build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

  # Frontend Tests and Build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular app
        run: npm run build:prod

  # Docker Build and Push
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push backend image
        run: |
          docker build -t $REGISTRY/bidroom-backend:${{ github.sha }} -t $REGISTRY/bidroom-backend:latest ./backend
          docker push $REGISTRY/bidroom-backend:${{ github.sha }}
          docker push $REGISTRY/bidroom-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -t $REGISTRY/bidroom-frontend:${{ github.sha }} -t $REGISTRY/bidroom-frontend:latest ./frontend
          docker push $REGISTRY/bidroom-frontend:${{ github.sha }}
          docker push $REGISTRY/bidroom-frontend:latest

  # Deploy to AKS
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group $RESOURCE_GROUP --name $AKS_CLUSTER

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/bidroom-backend backend=$REGISTRY/bidroom-backend:${{ github.sha }}
          kubectl set image deployment/bidroom-frontend frontend=$REGISTRY/bidroom-frontend:${{ github.sha }}
          kubectl rollout status deployment/bidroom-backend
          kubectl rollout status deployment/bidroom-frontend

      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get services
          kubectl get ingress

