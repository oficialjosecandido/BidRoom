name: Build and deploy Node.js app to Azure Web App - bidroom-backend-prod

on:
  push:
    branches:
      - ericeira-prod
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_514BDBF82CF64582BD0A8BDD3261ACB1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E211810EC57F40E4B475643EF78F6C4B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9D1F200D974B446B8715549D224AE368 }}

      - name: Zip deployment package
        run: zip -r deploy.zip . -x "*.git*"

      - name: Deploy to Azure Web App
        run: |
          RESOURCE_GROUP=$(az webapp list --query "[?name=='bidroom-backend-prod'].resourceGroup | [0]" -o tsv)
          echo "Deploying to resource group: $RESOURCE_GROUP"
          az webapp deploy \
            --name bidroom-backend-prod \
            --resource-group "$RESOURCE_GROUP" \
            --src-path deploy.zip \
            --type zip \
            --async false
